{{- if .Values.gatewayApi.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  {{- if .Values.gatewayApi.annotations }}
  annotations:
  {{- range $key, $value := .Values.gatewayApi.annotations }}
    {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.gatewayApi.parentRefs | nindent 4 }}
  {{- if .Values.gatewayApi.host }}
  hostnames:
    - {{ .Values.gatewayApi.host | quote }}
  {{- end }}
  rules:
    - matches:
        {{- range $path := .Values.gatewayApi.paths }}
        - path:
            type: PathPrefix
            value: {{ $path }}
        {{- end }}
      backendRefs:
        - name: {{ .Release.Name }}
          port: 80
{{ end }}
