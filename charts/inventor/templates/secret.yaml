kind: Secret
apiVersion: v1
metadata:
  name: {{ .Release.Name }}
data:
  API_TOKEN: {{ required "secret.API_TOKEN must be set explicitly - do not deploy with an empty/default token" .Values.secret.API_TOKEN | toString | b64enc }}
  {{- if .Values.secret.SD_TOKEN }}
  SD_TOKEN: {{ .Values.secret.SD_TOKEN | toString | b64enc }}
  {{- end }}
type: Opaque
